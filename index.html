<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shortcuts Setup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #24292f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shortcuts Setup</h1>

        <p>Open university websites.</p>

        <button onclick="openAll()">
            Open All
        </button>

    </div>

    <script>
        function openAll() {

            const websites = [
                "https://YOUR-MOODLE-URL-HERE",
                "https://outlook.office.com/",
                "https://github.com/"
            ];

            websites.forEach(url => {
                window.open(url, "_blank");
            });
        }
    </script>

</body>
</html>
