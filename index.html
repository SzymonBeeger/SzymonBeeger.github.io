<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shortcuts Setup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #24292f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #status {
            min-height: 1.5em;
            margin-top: 18px;
            color: #555;
        }

        .hint {
            margin-top: 28px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shortcuts Setup</h1>

        <p>Download your university shortcuts to a folder on your computer.</p>

        <button id="download-button" type="button">
            Download all shortcuts
        </button>

        <p id="status" role="status" aria-live="polite"></p>
        <p class="hint">On Chrome or Edge, you can choose the destination folder. Other browsers may ask you to allow multiple downloads.</p>

    </div>

    <script>
        const shortcuts = [
            { path: "shortcuts/GitHub%20Deployment.lnk", name: "GitHub Deployment.lnk" },
            { path: "shortcuts/Moodle.url", name: "Moodle.url" },
            { path: "shortcuts/Outlook.url", name: "Outlook.url" }
        ];

        const button = document.getElementById("download-button");
        const status = document.getElementById("status");

        button.addEventListener("click", downloadShortcuts);

        async function downloadShortcuts() {
            button.disabled = true;
            status.textContent = "Choose a folder for the shortcuts...";

            try {
                // This produces real files directly in a chosen folder and avoids
                // the browser's temporary .download/.crdownload filenames.
                if ("showDirectoryPicker" in window) {
                    const directory = await window.showDirectoryPicker({ mode: "readwrite" });

                    for (const shortcut of shortcuts) {
                        const response = await fetch(shortcut.path, { cache: "no-store" });
                        if (!response.ok) {
                            throw new Error(`Could not download ${shortcut.name}`);
                        }

                        const file = await directory.getFileHandle(shortcut.name, { create: true });
                        const writable = await file.createWritable();
                        await writable.write(await response.blob());
                        await writable.close();
                    }

                    status.textContent = "All shortcuts were saved successfully.";
                    return;
                }
            } catch (error) {
                if (error.name === "AbortError") {
                    status.textContent = "Download cancelled.";
                    return;
                }

                // Use the normal browser download flow if the folder picker is
                // unavailable or a file could not be written there.
                status.textContent = "Starting the downloads...";
            } finally {
                button.disabled = false;
            }

            // The download attribute supplies the correct extension and filename.
            // The small delay gives browsers time to register each download.
            for (const shortcut of shortcuts) {
                const link = document.createElement("a");
                link.href = shortcut.path;
                link.download = shortcut.name;
                link.hidden = true;
                document.body.appendChild(link);
                link.click();
                link.remove();
                await new Promise(resolve => setTimeout(resolve, 250));
            }

            status.textContent = "Downloads started. If prompted, allow multiple downloads for this site.";
        }
    </script>

</body>
</html>
