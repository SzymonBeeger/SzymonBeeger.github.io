<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shortcuts Setup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #24292f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #status {
            min-height: 1.5em;
            margin-top: 18px;
            color: #555;
        }

        .hint {
            margin-top: 28px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shortcuts Setup</h1>

        <p>Package your university shortcuts into one ZIP file.</p>

        <button id="download-button" type="button">
            Download shortcuts.zip
        </button>

        <p id="status" role="status" aria-live="polite"></p>
        <p class="hint">The ZIP will use your browser's normal download location. Extract it after downloading.</p>

    </div>

    <script>
        const shortcuts = [
            { path: "shortcuts/GitHub%20Deployment.lnk", name: "GitHub Deployment.lnk" },
            { path: "shortcuts/Moodle.url", name: "Moodle.url" },
            { path: "shortcuts/Outlook.url", name: "Outlook.url" }
        ];

        const button = document.getElementById("download-button");
        const status = document.getElementById("status");

        button.addEventListener("click", downloadShortcuts);

        async function downloadShortcuts() {
            button.disabled = true;
            status.textContent = "Building shortcuts.zip...";

            try {
                // Fetch the current files and package them on every click.
                const files = await Promise.all(shortcuts.map(async shortcut => {
                    const response = await fetch(shortcut.path, { cache: "no-store" });
                    if (!response.ok) {
                        throw new Error(`Could not download ${shortcut.name}`);
                    }

                    return {
                        name: shortcut.name,
                        data: new Uint8Array(await response.arrayBuffer())
                    };
                }));

                const zip = createZip(files);
                const objectUrl = URL.createObjectURL(zip);
                const link = document.createElement("a");
                link.href = objectUrl;
                link.download = "shortcuts.zip";
                link.hidden = true;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);

                status.textContent = "shortcuts.zip is downloading.";
            } catch (error) {
                status.textContent = "The ZIP could not be created. Please try again.";
                console.error(error);
            } finally {
                button.disabled = false;
            }
        }

        function createZip(files) {
            const encoder = new TextEncoder();
            const localFiles = [];
            const centralDirectory = [];
            let offset = 0;

            for (const file of files) {
                const name = encoder.encode(file.name);
                const checksum = crc32(file.data);
                const header = new Uint8Array(30 + name.length);
                const view = new DataView(header.buffer);

                view.setUint32(0, 0x04034b50, true);
                view.setUint16(4, 20, true);
                view.setUint16(6, 0x0800, true); // UTF-8 filenames
                view.setUint16(8, 0, true); // Store without compression
                view.setUint32(14, checksum, true);
                view.setUint32(18, file.data.length, true);
                view.setUint32(22, file.data.length, true);
                view.setUint16(26, name.length, true);
                header.set(name, 30);
                localFiles.push(header, file.data);

                const directoryEntry = new Uint8Array(46 + name.length);
                const directoryView = new DataView(directoryEntry.buffer);
                directoryView.setUint32(0, 0x02014b50, true);
                directoryView.setUint16(4, 20, true);
                directoryView.setUint16(6, 20, true);
                directoryView.setUint16(8, 0x0800, true);
                directoryView.setUint32(16, checksum, true);
                directoryView.setUint32(20, file.data.length, true);
                directoryView.setUint32(24, file.data.length, true);
                directoryView.setUint16(28, name.length, true);
                directoryView.setUint32(42, offset, true);
                directoryEntry.set(name, 46);
                centralDirectory.push(directoryEntry);

                offset += header.length + file.data.length;
            }

            const centralSize = centralDirectory.reduce((total, part) => total + part.length, 0);
            const end = new Uint8Array(22);
            const endView = new DataView(end.buffer);
            endView.setUint32(0, 0x06054b50, true);
            endView.setUint16(8, files.length, true);
            endView.setUint16(10, files.length, true);
            endView.setUint32(12, centralSize, true);
            endView.setUint32(16, offset, true);

            return new Blob([...localFiles, ...centralDirectory, end], { type: "application/zip" });
        }

        function crc32(bytes) {
            let checksum = 0xffffffff;

            for (const byte of bytes) {
                checksum ^= byte;
                for (let bit = 0; bit < 8; bit++) {
                    checksum = (checksum >>> 1) ^ (checksum & 1 ? 0xedb88320 : 0);
                }
            }

            return (checksum ^ 0xffffffff) >>> 0;
        }
    </script>

</body>
</html>
