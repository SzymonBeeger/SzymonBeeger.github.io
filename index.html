<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shortcuts Setup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
            background: #f5f5f5;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #24292f;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #status {
            min-height: 1.5em;
            margin-top: 18px;
            color: #555;
        }

        .hint {
            margin-top: 28px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Shortcuts Setup</h1>

        <p>Download your university shortcuts individually.</p>

        <button id="download-button" type="button">
            Download all shortcuts
        </button>

        <p id="status" role="status" aria-live="polite"></p>
        <p class="hint">The files will use your browser's normal download location. To save them to Desktop, enable “Ask where to save each file” in your browser's download settings.</p>

    </div>

    <script>
        const shortcuts = [
            { path: "shortcuts/GitHub%20Deployment.lnk", name: "GitHub Deployment.lnk" },
            { path: "shortcuts/Moodle.url", name: "Moodle.url" },
            { path: "shortcuts/Outlook.url", name: "Outlook.url" }
        ];

        const button = document.getElementById("download-button");
        const status = document.getElementById("status");

        button.addEventListener("click", downloadShortcuts);

        async function downloadShortcuts() {
            button.disabled = true;
            status.textContent = "Preparing the downloads...";

            try {
                // Turn each same-origin file into a blob URL. This removes the
                // server's suggested filename and lets the download attribute
                // control the final name and extension.
                const files = [];

                // Prepare and start each download separately. Some browsers
                // leave their temporary `.download` file behind when several
                // downloads are started at exactly the same time.
                for (const shortcut of shortcuts) {
                    const response = await fetch(shortcut.path, { cache: "no-store" });
                    if (!response.ok) {
                        throw new Error(`Could not download ${shortcut.name}`);
                    }

                    files.push({
                        name: shortcut.name,
                        blob: new Blob([await response.arrayBuffer()], { type: "application/octet-stream" })
                    });
                }

                for (const [index, file] of files.entries()) {
                    status.textContent = `Starting download ${index + 1} of ${files.length}...`;
                    const objectUrl = URL.createObjectURL(file.blob);
                    const link = document.createElement("a");
                    link.href = objectUrl;
                    link.download = file.name;
                    link.hidden = true;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();

                    // Keep the object URL alive while the browser starts the download.
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);

                    // Give the browser time to finish this download before
                    // starting the next one.
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }

                status.textContent = "Downloads started. If prompted, allow multiple downloads for this site.";
            } catch (error) {
                status.textContent = "The downloads could not be started. Please try again.";
                console.error(error);
            } finally {
                button.disabled = false;
            }
        }
    </script>

</body>
</html>
